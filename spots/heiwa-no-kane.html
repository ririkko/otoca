<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二上山 平和の鐘 — OTOCA Spot</title>
<link rel="stylesheet" href="../style.css">

<script type="application/ld+json">
{
  "@context": "https://otoca.app/schema/v1",
  "@type": "OtocaSpot",
  "spotId": "toyama_futagamiyama_heiwa_no_kane",
  "name": "二上山 平和の鐘",
  "area": "富山県高岡市城光寺",
  "description": "高岡市の二上山にある平和の鐘。山上に響く鐘の音、風、鳥の声が重なる、祈りと眺望の音スポット。現地でQRを読み込むと、平和の鐘にまつわる音トレカをランダムで採集できます。",
  "imageUrl": "https://drive.google.com/file/d/1QkMrtGghyUMMrnXyXYelbr9C_uqhdkRJ/view",
  "cards": [
    {
      "cardId": "heiwa_bell_main_tone",
      "title": "平和の鐘、一打の余韻",
      "rarity": "N",
      "description": "鐘を一度撞いたあと、二上山の空気に長く広がっていく基本の鐘音。",
      "audioUrl": "https://drive.google.com/file/d/1UFdRkVKizKpmKhuTlDAsxb8qiLquYAs-/view",
      "imageUrl": "https://drive.google.com/file/d/1G4IKtfqMrkiZActpYGoMy18p9uTYhIhW/view",
      "dropRate": 0.50
    },
    {
      "cardId": "heiwa_bell_mountain_echo",
      "title": "山に返る鐘の響き",
      "rarity": "R",
      "description": "山上から周囲へ反射しながら広がる、奥行きのある鐘の響き。",
      "audioUrl": "https://drive.google.com/file/d/1UFdRkVKizKpmKhuTlDAsxb8qiLquYAs-/view",
      "imageUrl": "https://drive.google.com/file/d/1QkMrtGghyUMMrnXyXYelbr9C_uqhdkRJ/view",
      "dropRate": 0.28
    }
  ]
}
</script>
</head>
<body>
  <main class="page">
    <section class="panel">
      <p class="badge">OTOCA SPOT</p>
      <h1 id="spotName">二上山 平和の鐘</h1>
      <p class="area" id="spotArea">📍 富山県高岡市城光寺</p>
      <img class="spot-image" id="spotImage" src="" alt="">
      <p id="spotDescription"></p>
    </section>

    <section class="panel">
      <h2>音みくじ</h2>
      <div class="draw-area">
        <p>現地でQRを読み込んだ人だけが、この場所の音トレカをランダムで採集できます。</p>
        <button class="otoca-link" type="button" id="drawButton">OTOCA で音を採集する 🎵</button>
        <div id="drawResult"></div>
      </div>
    </section>

    <section class="panel">
      <h2>このスポットで集められる音トレカ</h2>
      <ul class="card-list" id="cardList"></ul>
    </section>

    <section class="panel">
      <h2>保存済みコレクション</h2>
      <div id="collectionList" class="collection-list"></div>
      <button class="text-button" id="clearCollectionButton" type="button">コレクションを削除</button>
    </section>

    <p class="footer-note">
      このページは OTOCA スポット情報ページのサンプルです。<br>
      JSON-LDで <code>@type: "OtocaSpot"</code> を記述すると、ページ内のスクリプトがスポット情報として読み取ります。<br>
      画像URL・音源URLは仮置きです。Google Driveなどの公開URLへ差し替えてください。
    </p>
  </main>

  <script src="../app.js"></script>
  <script>
    renderSpotPage();
    renderCollectionList();
  </script>
</body>
</html>
